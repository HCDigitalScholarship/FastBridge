[pytest]
# Import root must be FastBridgeApp: the app imports modules by bare name (e.g.
# `from text import Text`) and uses cwd-relative templates/data paths.
pythonpath = FastBridgeApp
testpaths = FastBridgeApp/tests

# The Playwright e2e suite lives under FastBridgeApp/tests/e2e (Node project); keep pytest
# from recursing into its node_modules and JS artifacts.
norecursedirs = node_modules test-results playwright-report

# Run the pure-unit suite with:   pytest FastBridgeApp/tests/unit
# (integration tests need a live temporary Mongo and are added in Phase 3)
markers =
    slow: loads heavy NLP models (Stanza/CLTK); excluded from default and CI runs
    integration: requires a live (but temporary) MongoDB; not part of the pure-unit suite

addopts = -ra --strict-markers
