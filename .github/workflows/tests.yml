name: tests

# Run the unit suite on pull requests into dev/master and on pushes to dev and master, so a broken 
# test blocks the merge instead of rotting unnoticed.
on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# If the same branch or PR gets a new push, drop the older in-progress run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The unit tests mock out the heavy libraries (Stanza, CLTK, pandas, torch) and never
      # connect to a database, so only the test tooling is needed.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest FastBridgeApp/tests/unit -m "not slow"
