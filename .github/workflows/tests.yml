name: tests

# Run the unit suite on pull requests into dev/master and on pushes to dev and master, so a broken 
# test blocks the merge instead of rotting unnoticed.
on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# If the same branch or PR gets a new push, drop the older in-progress run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The unit tests mock out the heavy libraries (Stanza, CLTK, pandas, torch) and never
      # connect to a database, so only the test tooling is needed.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest FastBridgeApp/tests/unit -m "not slow"

  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The integration tests mock the heavy ML stack and exercise only the web and Mongo
      # layers, so we install just those libraries instead of the full requirements.txt.
      # email-validator (userspace models) and requests (firebase_auth import) are pulled in
      # by the userspace router the star-route test mounts, beyond the base set.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt fastapi jinja2 python-multipart httpx pymongo python-dotenv email-validator requests

      - name: Run integration tests
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_TLS: "false"
        run: pytest FastBridgeApp/tests/integration -ra
