  <!-- Skip to main content link - WCAG 2.1 SC 2.4.1 -->

  <!-- Global ARIA live region for announcements - WCAG 2.1 SC 4.1.3 -->

  <!-- Skip link dynamic behavior -->
  <script>
    (function() {
      const skipLink = document.querySelector('.skip-to-main');
      if (skipLink) {
        skipLink.addEventListener('click', function(e) {
          // Try multiple common IDs in order of preference
          const targetIds = ['result', 'main-content', 'bridge-select', 'content', 'userspace-content'];
          let targetElement = null;

          for (let id of targetIds) {
            targetElement = document.getElementById(id);
            if (targetElement) {
              e.preventDefault();
              targetElement.setAttribute('tabindex', '-1');
              targetElement.focus();
              break;
            }
          }

          // If no specific ID found, try to find the first section or main element
          if (!targetElement) {
            targetElement = document.querySelector('section[role="main"], main, section');
            if (targetElement) {
              e.preventDefault();
              if (!targetElement.id) {
                targetElement.id = 'main-content';
              }
              targetElement.setAttribute('tabindex', '-1');
              targetElement.focus();
            }
          }
        });
      }
    })();
  </script>
