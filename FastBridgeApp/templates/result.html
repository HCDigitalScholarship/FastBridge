<body style="height:70vh;" id="main">{% include "partials/refine_sidebar.html" %}<section id="result" class="download-section content-section text-center" role="main" style="background:url('/assets/img/background-img-gray.jpg') fixed center center no-repeat; background-size:cover;">

  <div class="container">
<h2> Now showing <span id = "len"> {{ len }} </span> words in {{ section }} </h2>

  <style>
    #contentArea tr[data-lemma] { cursor: pointer; }
    #contentArea tr.row-selected > td { background: rgba(34,179,179,0.35) !important; }
    #floating-action-bar {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 1050;
      display: none; align-items: center; flex-wrap: wrap; gap: 10px;
      background: rgba(20,20,20,0.97); border: 1px solid #2a6b6b; border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55); padding: 12px 18px; color: #fff; max-width: 94vw;
    }
    #floating-action-bar .fab-divider { width:1px; height:26px; background:#444; margin:0 4px; }
  </style>

  <!-- Save this search: bookmark the current search URL + filters to re-run later -->
  <div id="load-search-container"></div>
  <div id="save-search-container" style="display:none; margin-bottom:10px;">
    <input type="text" id="save-search-name" class="form-control" aria-label="Name this search" style="width:14rem; display:inline-block; margin-right:12px; padding:10px; border-radius:6px; border:1px solid #22b3b3; background:#222; color:#fff; font-size:1rem;" placeholder="Name this search..." />
    <button id="save-search-btn" class="btn btn-success" style="border-radius:6px; font-weight:600; background-color:#228383;">Save Search</button>
  </div>
  <span id="save-search-message" style="margin-left:12px; color:#ffb366; font-weight:500;"></span>

  <div style="display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap;">
    <input class="form-control" style="width:20rem; padding:10px; border-radius:6px; border:1px solid #22b3b3; background:#222; color:#fff; font-size:1rem;" type="text" placeholder="Search for terms..." aria-label="Search for terms" id="search"/>
    <button type="button" id="select-all-terms-btn" class="btn btn-default" style="display:none; border-radius:6px; font-weight:600; border:1px solid #22b3b3; color:#22b3b3;" onclick="selectAllActive()">Select all terms</button>
  </div>

  <!-- Floating action bar: slides in when rows are selected (Gmail-style) -->
  <div id="floating-action-bar">
    <span id="selection-count" style="font-weight:700; margin-right:4px;">0 selected</span>
    <button type="button" class="btn btn-sm btn-default" style="border-radius:6px;" onclick="selectAllActive()">Select All</button>
    <button type="button" class="btn btn-sm btn-default" style="border-radius:6px;" onclick="invertSelection()">Invert</button>
    <button type="button" class="btn btn-sm btn-default" style="border-radius:6px;" onclick="clearSelection()">Clear</button>
    <span class="fab-divider"></span>
    <span id="save-list-container">
      <input type="text" id="save-list-name" class="form-control" style="width:11rem; display:inline-block; margin-right:8px; padding:8px; border-radius:6px; border:1px solid #22b3b3; background:#222; color:#fff;" placeholder="New list name..." />
      <button id="save-list-btn" class="btn btn-success" style="border-radius:6px; font-weight:600; background-color:#228383;">Save as New List</button>
    </span>
    <span id="add-to-list-section" style="display:none;">
      <span class="fab-divider"></span>
      <select id="add-to-list-select" style="padding:8px 10px; border-radius:6px; border:1px solid #22b3b3; background:#222; color:#fff; margin-right:8px;"></select>
      <button id="add-to-list-btn" class="btn btn-success" style="border-radius:6px; font-weight:600; background-color:#228383;">Add to List</button>
    </span>
    <span id="add-to-list-message" style="margin-left:10px; color:#ffb366; font-weight:500;"></span>
    <span id="save-list-message" style="margin-left:10px; color:#ffb366; font-weight:500;"></span>
  </div>

{% include "partials/results_table.html" %}
  <a class="btn btn-primary btn-lg btn-default" role="button" href="/select" style="border-radius: 35px;padding: 10px 20px;font-size: 16px;font-family: Actor, sans-serif;">Search again</a>
