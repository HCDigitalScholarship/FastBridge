{% extends "stats-multiple-base.html" %}
{% block content %}
<!-- Style goes here -->
<style>
    .dropdown-container {
        position: relative;
        top: 100px;
    }

    .loader {
        border: 16px solid #f3f3f3;
        border-top: 16px solid #3498db;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 2s linear infinite;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    .col-md-6 {
        background-color: rgba(0, 0, 0, 0.7);
    }

    .masthead {
        padding-top: 80px;  /* Adjust this value according to the height of your navbar */
    }

    /* Chat styles */
    #chatSlideOut {
        position: fixed;
        width: 18.75rem;
        top: 10rem;
        right: -18.75rem;
        background-color: rgba(81, 81, 81, 0.9);
        z-index: 100000000;
        transition: all 0.5s cubic-bezier(0, 1, 0.5, 1);
    }

    .showChatSlideOut {
        right: 0px !important;
    }

    #chatSlideOutTab {
        position: absolute;
        left: -40px;
        height: 200px;
        width: 40px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        background-color: #227373;
        box-shadow: 2px 2px 2px 2px #409696ff;
        color: #fff;
        border-radius: 5px 0 0 5px;
        z-index: 100000000;
    }

    #chatSlideOutTab div {
        text-align: center;
        position: relative;
        right: 70px;
        top: 90px;
        background-color: inherit;
        color: #fff;
        width: 180px;
        transform: rotate(270deg);
        writing-mode: lr-tb;
    }

    .modal-content {
        background-color: rgba(110, 110, 110, 0.97);
        height: 70vh;
        display: flex;
        flex-direction: column;
    }

    .modal-header {
        padding: 1rem;
        border-bottom: 1px solid #dee2e6;
    }

    .modal-title {
        margin: 0;
        color: white;
    }

    .modal-body {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
    }

    .scrollable {
        max-height: 100%;
        overflow-y: auto;
    }

    #chat-form {
        display: flex;
        padding: 0.5rem;
        gap: 0.5rem;
    }

</style>

{% block scripts %}
<!-- Scripts go here -->
<!-- updateData -->
<script>
    function updateData(dropdownId) {
        var selectElement = document.getElementById(dropdownId);
        var selectedIndex = selectElement.selectedIndex;
        var selectedValue = selectElement.value;

        let textName, sectionStart, sectionEnd;

        if (selectedValue.includes('+')) {
            const parts = selectedValue.split('+');
            textName = string_to_slug(parts[0]);
            sectionStart = parts[1];
            sectionEnd = parts[2];
        } else {
            var currentUrl = window.location.href;
            var urlParts = currentUrl.split("/");

            // Extract section data
            var sections = urlParts[urlParts.length - 3];
            var starts_and_ends = sections.split("-");
            var starts = starts_and_ends[0].split("+");
            var ends = starts_and_ends[1].split("+");

            // Extract textname
            var text_names_raw = urlParts[urlParts.length - 4];
            var text_names = text_names_raw.split("+");

            textName = text_names[selectedIndex];
            sectionStart = starts[selectedIndex];
            sectionEnd = ends[selectedIndex];
        }

        var url = `/stats/get_metrics/${textName}/${sectionStart}-${sectionEnd}/${selectedIndex}`;

        // Show the loader
        var loaderElement = dropdownId === "dropdown1"
            ? document.getElementById("loader1")
            : document.getElementById("loader2");

        loaderElement.style.display = "block";

        // Fetch HTML normally - context will be embedded in the response
        fetch(url)
        .then(response => response.text())
        .then(data => {
            const columnId = dropdownId === "dropdown1" ? "column1" : "column2";
            document.getElementById(columnId).innerHTML = data;
            setupPlotModal();
            loaderElement.style.display = "none";
            
            // Extract the embedded context from the loaded HTML
            const scriptMatches = data.match(/<script>\s*const context = (.+?);\s*<\/script>/);
            if (scriptMatches && window.chatCompare) {
                try {
                    const contextData = JSON.parse(scriptMatches[1]);
                    window.chatCompare.addTextToChat(contextData);
                } catch (error) {
                    console.error('Error parsing embedded context:', error);
                }
            }
        }).catch(error => {
            loaderElement.style.display = "none";
        });
    }

</script>

<!-- Enlarging Plots script -->
<script>
    function setupPlotModal() {
        // Get the modal
        var modal = document.getElementById("plotModal");

        // Get the image element inside the modal
        var modalImg = document.getElementById("img01");

        // Select all plot images
        var plotImages = document.querySelectorAll(".plot-img");

        // Add click listener to each plot image
        plotImages.forEach(function (img) {
            img.addEventListener("click", function () {
                modal.style.display = "block";
                modalImg.src = this.src;
            });
        });

        // Select all info icons with data-img attributes
        var infoIcons = document.querySelectorAll(".info-icon");
        infoIcons.forEach(function (icon) {
            icon.addEventListener("click", function () {
                var imgPath = this.getAttribute("data-img");
                if (imgPath) {
                    modal.style.display = "block";
                    modalImg.src = imgPath;
                }
            });
        });

        // Get the <span> element that closes the modal
        var span = document.getElementsByClassName("close")[0];
        if (span) {
            span.onclick = function () {
                modal.style.display = "none";
            };
        }

        // Close the modal if the user clicks outside the modal content
        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };
    }

    document.addEventListener("DOMContentLoaded", setupPlotModal);
</script>

<!-- updateData for default selection -->
<script>
    function updateDataDefault(dropdownId) {
        var selectElement = document.getElementById(dropdownId);
        var selectedIndex;

        if (dropdownId === "dropdown1") {
            selectedIndex = 0; // default to the first option for dropdown1
        } else if (dropdownId === "dropdown2") {
            selectedIndex = 1; // default to the second option for dropdown2
        } else {
            selectedIndex = selectElement.selectedIndex; // keep this as a fallback
        }

        var textName = selectElement.options[selectedIndex].text;

        // Get the current URL
        var currentUrl = window.location.href;

        // Extract the sections from the current URL
        var urlParts = currentUrl.split("/");

        //extract starts and ends
        var sections = urlParts[urlParts.length - 3];//for some reason 3 is the right number
        var starts_and_ends = sections.split("-")

        var starts = starts_and_ends[0].split("+")
        var ends = starts_and_ends[1].split("+")

        //extract textname
        var text_names_raw = urlParts[urlParts.length - 4];
        var text_names = text_names_raw.split("+")
        var selected_text_filename = text_names[selectedIndex]

        var sectionStart = starts[selectedIndex];
        var sectionEnd = ends[selectedIndex];

        // Construct the URL for the GET request
        var url = "/stats/get_metrics/" + selected_text_filename + "/" + sectionStart + "-" + sectionEnd + "/" + selectedIndex;


        // Show the loader before starting the request
        var loaderElement;
        if (dropdownId === "dropdown1") {
            loaderElement = document.getElementById("loader1");
        } else if (dropdownId === "dropdown2") {
            loaderElement = document.getElementById("loader2");
        }
        loaderElement.style.display = "block";

        // Make the GET request and update the page with the received data
        fetch(url)
            .then(response => response.text())
            .then(data => {
                if (dropdownId === "dropdown1") {
                    document.getElementById("column1").innerHTML = data;
                } else if (dropdownId === "dropdown2") {
                    document.getElementById("column2").innerHTML = data;
                }
                setupPlotModal()
                // Hide the loader after the request is complete
                loaderElement.style.display = "none";
                
                // Extract the embedded context from the loaded HTML
                const scriptMatches = data.match(/<script>\s*const context = (.+?);\s*<\/script>/);
                if (scriptMatches && window.chatCompare) {
                    try {
                        const contextData = JSON.parse(scriptMatches[1]);
                        if (dropdownId === "dropdown1") {
                            window.chatCompare.initializeChat(contextData);
                        } else {
                            window.chatCompare.addTextToChat(contextData);
                        }
                    } catch (error) {
                        console.error('Error parsing embedded context:', error);
                    }
                }
            })
            .catch(error => {
                console.error('Error loading data for', dropdownId, ':', error);
                loaderElement.style.display = "none";
            });
    }
</script>

<script>

    var textsAndSections = {{ texts_and_sections| tojson | safe }};
    function versionCompare(a, b) {
        const aParts = a.split('.').map(Number);
        const bParts = b.split('.').map(Number);
        const len = Math.max(aParts.length, bParts.length);

        for (let i = 0; i < len; i++) {
            const aVal = aParts[i] || 0;
            const bVal = bParts[i] || 0;

            if (aVal < bVal) return -1;
            if (aVal > bVal) return 1;
        }
        return 0; // equal
    }

    function updateDropdowns() {
        // Get the selected key from dropdown1
        var selectedKey = document.getElementById("new-dropdown1").value;
        // Get the corresponding object from textsAndSections dictionary
        var sectionObj = textsAndSections[selectedKey];

        // Convert the object to a list of section numbers
        var sections = Object.keys(sectionObj);
        
        // Sort the sections (alphabetically by default, or use a custom sort for numbers)
        sections.sort((a, b) => {
            // Handle "start" and "end"
            if (a === "start") return -1;
            if (b === "start") return 1;
            if (a === "end") {
                if (b === "start") return 1; 
                return -1;
            }
            if (b === "end") {
                if (a === "start") return -1;
                return 1;
            }

            // Helper to split into numeric and alpha components
            const splitPart = part =>
                part.match(/\d+|[a-zA-Z]+/g).map(sub => (isNaN(sub) ? sub : Number(sub)));

            const aParts = a.split('.').flatMap(splitPart);
            const bParts = b.split('.').flatMap(splitPart);
            const len = Math.max(aParts.length, bParts.length);

            for (let i = 0; i < len; i++) {
                const aVal = aParts[i];
                const bVal = bParts[i];

                if (aVal === undefined) return -1;
                if (bVal === undefined) return 1;

                if (typeof aVal === 'number' && typeof bVal === 'number') {
                    if (aVal !== bVal) return aVal - bVal;
                } else if (typeof aVal === 'string' && typeof bVal === 'string') {
                    if (aVal !== bVal) return aVal.localeCompare(bVal);
                } else {
                    return typeof aVal === 'number' ? -1 : 1;
                }
            }

            return 0;
        });


        // Get references to dropdown2 and dropdown3
        var dropdown2 = document.getElementById("new-dropdown2");
        var dropdown3 = document.getElementById("new-dropdown3");

        // Clear existing options
        dropdown2.innerHTML = '';
        dropdown3.innerHTML = '';

        // Populate dropdowns with sorted sections
        sections.forEach(function (section) {
            var option2 = document.createElement("option");
            option2.text = section;
            option2.value = section;
            dropdown2.add(option2);

            var option3 = document.createElement("option");
            option3.text = section;
            option3.value = section;
            dropdown3.add(option3);
        });
    }

</script>

<!-- 'Add New Text' Submit button -->
<script>
    function string_to_slug(str) {
        str = str.replace(/^\s+|\s+$/g, ""); // trim
        str = str.toLowerCase();

        // remove accents, swap ñ for n, etc
        var from = "àáäâèéëêìíïîòóöôùúüûñç·/_,:;";
        var to = "aaaaeeeeiiiioooouuuunc      ";
        for (var i = 0, l = from.length; i < l; i++) {
            str = str.replace(new RegExp(from.charAt(i), "g"), to.charAt(i));
        }

        str = str
            .replace(/[^a-z0-9 -]/g, "") // remove invalid chars
            .replace(/\s+/g, "_"); // collapse whitespace and replace by _

        return str;
    }

    function optionExists(dropdown, value) {
        return Array.from(dropdown.options).some(option => option.value === value);
    }

    document.getElementById("submit-btn").addEventListener("click", function () {
        var textname = document.getElementById("new-dropdown1").value;
        var section_start = document.getElementById("new-dropdown2").value;
        var section_end = document.getElementById("new-dropdown3").value;

        var value = `${textname}+${section_start}+${section_end}`;
        var displayText = `${textname} (${section_start}-${section_end})`;

        if (!optionExists(dropdown1, value)) {
            var option1 = document.createElement("option");
            option1.text = displayText;
            option1.value = value;
            dropdown1.add(option1);

            var option2 = document.createElement("option");
            option2.text = displayText;
            option2.value = value;
            dropdown2.add(option2);
            
            var dropdownToUpdate = Math.random() < 0.5 ? dropdown1 : dropdown2;
            dropdownToUpdate.value = value;
    
            const button = document.getElementById('back-btn-1');
            button.click();
            updateData(dropdownToUpdate.id);
        }
    });

</script>

<!-- 'Delete Text' Submit button -->
<script>
    document.getElementById("del-submit-btn").addEventListener("click", function () {

        var selectElement = document.getElementById("del-dropdown1");
        var selectedIndex = selectElement.selectedIndex;

        var textname = document.getElementById("del-dropdown1").value;


        // Get the current URL
        var currentUrl = window.location.href;

        // Extract the sections from the current URL
        var urlParts = currentUrl.split("/");

        //extract starts and ends
        var sections = urlParts[urlParts.length - 3];//for some reason 3 is the right number
        var starts_and_ends = sections.split("-")
        var starts = starts_and_ends[0].split("+")
        var ends = starts_and_ends[1].split("+")

        //extract text names
        var text_names_raw = urlParts[urlParts.length - 4];
        var text_names = text_names_raw.split("+")

        //add new selected text, starts, ends to array
        text_names.splice(selectedIndex, 1)
        starts.splice(selectedIndex, 1)
        ends.splice(selectedIndex, 1)

        //put text_names, starts, ends back into proper string URL format
        textnames_url = ""
        starts_url = ""
        ends_url = ""

        for (var i = 0; i < text_names.length; i++) {
            if (i != text_names.length - 1) {
                textnames_url += (text_names[i] + "+")
            }
            else {
                textnames_url += text_names[i]
            }
        }
        for (var i = 0; i < starts.length; i++) {
            if (i != starts.length - 1) {
                starts_url += (starts[i] + "+")
            }
            else {
                starts_url += starts[i]
            }
        }
        for (var i = 0; i < ends.length; i++) {
            if (i != ends.length - 1) {
                ends_url += (ends[i] + "+")
            }
            else {
                ends_url += ends[i]
            }
        }

        // Construct the URL for the GET request
        var url = "/stats/Latin/result/" + textnames_url + "/" + starts_url + "-" + ends_url + "/non_running"

        //redirect to the URL
        window.location.href = url
    });
</script>

<!-- Default Selections on Page Load -->
<script>
    function handlePageLoad() {
        // Check if we're running on a server (not localhost)
        const isServer = !window.location.hostname.includes('localhost') && 
                        !window.location.hostname.includes('127.0.0.1');
        
        if (isServer) {
            updateDataDefault('dropdown1');
            setTimeout(() => {
                updateDataDefault('dropdown2');
            }, 500); // Longer delay for server... sometimes server doesn't load both at once
        } else {
            updateDataDefault('dropdown1');
            updateDataDefault('dropdown2');
        }
        
        updateDropdowns();
    }
</script>
