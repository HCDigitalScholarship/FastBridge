{% extends 'base.html' %}

{% block content %}
<body>
  <section class="content-section" style="background: url('/assets/img/background-img-gray.jpg') fixed center center no-repeat; background-size: cover;background-position: top;max-height: 90vh;">

    <style>
      h2 {
        text-align: center;
        margin-top: 20px;
        color: #228383;
      }
      .auth-form-container {
        max-width: 400px;
        margin: 40px auto;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        padding: 32px 24px;
        text-align: center;
        max-height: 60vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .auth-form-container h2 {
        margin-bottom: 24px;
        font-size: 1.6em;
      }
      .auth-form-container input[type="email"],
      .auth-form-container input[type="password"] {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 1em;
      }
      .auth-form-container input[type="submit"],
      .auth-form-container button {
        width: 95%;
        padding: 10px;
        margin: 12px 0 8px 0;
        background: #228383;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 1em;
        cursor: pointer;
        transition: background 0.2s;
      }
      .auth-form-container button {
        background: #ea4335;
      }
      .auth-form-container input[type="submit"]:hover,
      .auth-form-container button:hover {
        background: #226464ff;
      }
      .auth-form-container button:hover {
        background: #c5221f;
      }
      .auth-form-container a {
        color: #228383;
        text-decoration: none;
        font-weight: 500;
      }
      .auth-form-container a:hover {
        text-decoration: underline;
      }
    </style>

    <div class="auth-form-container">
      <h2>Sign in to your account</h2>

      <form id="login-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="submit" value="Login">
      </form>

      <form method="get" action="/account/google-login">
        <button type="submit">Login with Google</button>
      </form>
      <div style="margin-top:12px;">
        <a href="#" id="forgot-password-link">Forgot Password?</a>
      </div>
      <div style="margin-top:12px;">
        Don't have an account? <a role="button" href="/account/signup">Sign Up</a>
      </div>
    </div>
  </section>
</body>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      fetch("/account/login", {
        method: "POST",
        body: JSON.stringify({
          email: form.email.value,
          password: form.password.value
        }),
        headers: { "Content-Type": "application/json" }
      }).then(res => {
        if (res.redirected) {
          window.location.href = res.url;  
        } else {
          res.json().then(data => alert("Error: " + data.detail));
        }
      });
    });
  </script>

  <script>
    document.getElementById("forgot-password-link").addEventListener("click", async () => {
      const email = prompt("Enter your email for password reset:");
      if (!email) return;

      try {
        const res = await fetch("/account/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        alert(data.message);
      } catch (err) {
        console.error(err);
        alert("Failed to send password reset link.");
      }
    });
  </script>

{% endblock %}
